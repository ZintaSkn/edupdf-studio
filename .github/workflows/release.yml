# Construit l'installateur Windows et publie la mise à jour à chaque tag vX.Y.Z
name: Publier une version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --omit=optional : évite « canvas » (dépendance facultative de pdf.js, inutile ici)
      - run: npm ci --omit=optional
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
