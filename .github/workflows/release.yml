# Construit l'installateur Windows et publie la mise à jour à chaque tag vX.Y.Z
# Une version n'est publiée que si l'audit de sécurité et l'auto-test complet réussissent.
name: Publier une version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # --omit=optional : évite « canvas » (dépendance facultative de pdf.js, inutile ici)
      - run: npm ci --omit=optional
      # binaire Electron pour l'auto-test (scripts d'installation bloqués par défaut par les npm récents)
      - run: node node_modules/electron/install.js
      # Aucune faille élevée ou critique tolérée dans les dépendances de l'application
      - run: npm audit --omit=dev --audit-level=high
      # Règles du service d'activation des licences (un poste à la fois, transfert, cumul de 2)
      - run: node server/test-core.js
      # Auto-test complet (édition, polices, PDF protégés, OCR, formulaires, conversions, IA, administration, affichage)
      - name: Auto-test
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'selftest'; New-Item -ItemType Directory -Force $dir | Out-Null
          $env:EDUPDF_SELFTEST = $dir
          $p = Start-Process -FilePath "node_modules\electron\dist\electron.exe" -ArgumentList '.' -PassThru -Wait
          Get-Content "$dir\selftest.log"
          if (-not (Select-String -Path "$dir\selftest.log" -Pattern '^ALL OK' -Quiet)) { Write-Error 'Auto-test en échec : version non publiée.'; exit 1 }
      # La version est créée d'abord : évite que les envois en parallèle créent deux versions identiques
      # Titre et notes tirés de CHANGELOG.md (section de la version publiée)
      - name: Version GitHub et notes
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          $title = node tools/release-notes.js $v --title
          node -e "require('fs').writeFileSync('notes.md', require('child_process').execFileSync('node', ['tools/release-notes.js', process.argv[1]]))" $v
          gh release create $v --title "$title" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { Write-Host 'version déjà créée : notes mises à jour'; gh release edit $v --title "$title" --notes-file notes.md }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signature de code SignPath (si les secrets SIGNPATH_* sont définis) : application, désinstalleur et installateur
      # sont envoyés à SignPath puis attendent l'approbation manuelle d'un approbateur (voir CODE_SIGNING.md).
      # Sans secrets, l'exécutable Electron reste intact (contrôle intelligent des applications de Windows 11).
      - name: Installateur Windows
        shell: pwsh
        timeout-minutes: 240
        run: |
          $extra = @()
          if ($env:SIGNPATH_API_TOKEN) { $extra = @('-c.win.signAndEditExecutable=true'); Write-Host 'Signature SignPath activée' }
          npx electron-builder --win --publish always @extra
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      # Mise à jour du contenu sans installateur (contrôle intelligent de Windows) : publiée ici, puis signée par
      # l'éditeur sur son ordinateur (node tools/maj.js signer X.Y.Z) — la clé de signature n'est jamais sur GitHub.
      - name: Contenu à signer (mise à jour sans installateur)
        shell: pwsh
        run: |
          node tools/maj.js paquet dist\win-unpacked\resources dist\contenu
          gh release upload "${{ github.ref_name }}" (Get-ChildItem dist\contenu -File).FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Paquet Microsoft Store (.appx) : signé par Microsoft à la publication dans le Store, donc accepté par le
      # contrôle intelligent des applications. Identité fournie par l'Espace partenaires (variables du dépôt
      # STORE_IDENTITY_NAME et STORE_PUBLISHER) ; à téléverser dans l'Espace partenaires (voir docs/MICROSOFT-STORE.md).
      - name: Paquet Microsoft Store
        continue-on-error: true
        shell: pwsh
        run: |
          $extra = @()
          if ($env:STORE_IDENTITY_NAME) { $extra += "-c.appx.identityName=$env:STORE_IDENTITY_NAME" }
          if ($env:STORE_PUBLISHER) { $extra += "-c.appx.publisher=$env:STORE_PUBLISHER" }
          npx electron-builder --win appx --publish never @extra
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: microsoft-store-${{ github.ref_name }}
          path: dist/*.appx
          if-no-files-found: error
          retention-days: 90
      # Empreintes SHA-256 publiées avec la version (vérification par les établissements)
      - name: Empreintes
        shell: pwsh
        run: |
          Get-ChildItem dist, dist\contenu -File | Where-Object { $_.Extension -in '.exe', '.yml', '.zip', '.asar', '.json' } | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist\SHA256SUMS-windows.txt
          gh release upload "${{ github.ref_name }}" dist\SHA256SUMS-windows.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS et Linux : construits seulement si la version Windows (auto-test complet) a réussi
  autres-systemes:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cible: --mac
          - os: ubuntu-latest
            cible: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --omit=optional
      - run: node node_modules/electron/install.js
      # Application non signée par Apple : pas de recherche de certificat (Gatekeeper avertira à la première ouverture)
      - run: npx electron-builder ${{ matrix.cible }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
