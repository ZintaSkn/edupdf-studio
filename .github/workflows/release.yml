# Construit l'installateur Windows et publie la mise à jour à chaque tag vX.Y.Z
name: Publier une version
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # --omit=optional : évite « canvas » (dépendance facultative de pdf.js, inutile ici)
      - run: npm ci --omit=optional
      # La version est créée d'abord : evite que les envois en parallèle créent deux versions identiques
      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "Mise à jour automatique d'EduPDF Studio." || echo "version déjà créée"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
