# Service d'activation des licences SknEDU-studio (Cloudflare Workers, offre gratuite suffisante).
# Étapes : docs/SERVEUR-LICENCES.md
name = "sknedu-licences"
main = "worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Espace de stockage : créer avec « npx wrangler kv namespace create LICENCES » puis coller l'identifiant ci-dessous.
[[kv_namespaces]]
binding = "LICENCES"
id = "A_REMPLACER_PAR_L_IDENTIFIANT_DU_KV"

[vars]
# Clé publique de l'éditeur (identique à PUBLIC_KEY dans src/license.js)
LICENCE_PUBLIC_KEY = """-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAAWJBQvHRbjGXeR/8N0o1OQtxGqcDumYikk/rFmLnNyQ=
-----END PUBLIC KEY-----"""

# Secret (jamais dans ce fichier) : npx wrangler secret put SERVER_PRIVATE_KEY  ← contenu de cle-privee-serveur.pem
