# Service d'activation des licences SknEDU-studio (Cloudflare Workers, offre gratuite suffisante).
# Étapes : docs/SERVEUR-LICENCES.md
name = "sknedu-licences"
main = "worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Stockage : un Durable Object unique (SQLite, offre gratuite). Toutes les demandes y sont traitées l'une après l'autre :
# une licence ne peut jamais être activée sur deux postes en même temps, et un transfert est pris en compte immédiatement.
[[durable_objects.bindings]]
name = "STORE"
class_name = "LicenceStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LicenceStore"]

# Journaux et métriques du service (supervision continue) : tableau de bord Cloudflare › Workers › sknedu-licences › Observability
[observability]
enabled = true

[vars]
# Clé publique de l'éditeur (identique à PUBLIC_KEY dans src/license.js)
LICENCE_PUBLIC_KEY = """-----BEGIN PUBLIC KEY-----
MCowBQYDK2VwAyEAAWJBQvHRbjGXeR/8N0o1OQtxGqcDumYikk/rFmLnNyQ=
-----END PUBLIC KEY-----"""

# Secret (jamais dans ce fichier) : npx wrangler secret put SERVER_PRIVATE_KEY  ← contenu de cle-privee-serveur.pem
# (L'ancien espace KV « LICENCES » n'est plus utilisé ; il peut être supprimé dans le tableau de bord.)
